<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ER Status Board – Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mut:#5b6b7a;--card:#fff;--line:#d3dae1;--acc:#0f6b73;--warn:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151c;--ink:#e6edf3;--mut:#93a4b4;--card:#16212b;--line:#2a3948;--acc:#5fc4cc;--warn:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151c;--ink:#e6edf3;--mut:#93a4b4;--card:#16212b;--line:#2a3948;--acc:#5fc4cc;--warn:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.35rem;margin:0}
.sub{color:var(--mut);font-size:.88rem}
select,input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
button{cursor:pointer;background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.9rem;line-height:1.1}
.stat span{color:var(--mut);font-size:.88rem}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tabs button{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--mut);margin-bottom:10px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.grid{display:grid;gap:10px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.pt{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:10px;padding:10px 12px}
.pt.done{opacity:.62}
.e1{--c:#d62839}.e2{--c:#f28c28}.e3{--c:#e6b800}.e4{--c:#2e9e5b}.e5{--c:#3a7bd5}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.badge{background:var(--c);color:#14202b;font-weight:700;border-radius:6px;padding:0 7px;font-size:.82rem}
.e1 .badge,.e2 .badge,.e5 .badge{color:#fff}
.e2 .badge{color:#14202b}
.meta{color:var(--mut);font-size:.9rem;margin:4px 0 8px}
.late{color:var(--warn);font-weight:700}
.act{display:flex;flex-wrap:wrap;gap:6px}
.act select{flex:1 1 130px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.panel h2{font-size:1.05rem;margin:0 0 8px}
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:700}
.note{color:var(--mut);font-size:.85rem;margin-top:14px}
.empty{padding:22px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ER status board</h1>
      <div class="sub">Prototype · fake data only</div>
    </div>
    <label class="sub">Signed in as <select id="who" aria-label="Signed in as"></select></label>
  </header>
  <div id="app"></div>
  <p class="note">Switching users here simulates roles. It is not real security. Never enter real patient information in this prototype.</p>
</div>
<script>
var KEY='er-board-proto-v1',M=60000;
var STATUSES=['Waiting','In treatment','Awaiting results','Discharged','Admitted','Transferred'];
var CLOSED=['Discharged','Admitted','Transferred'];
var ESI={1:'Resuscitation',2:'Emergent',3:'Urgent',4:'Less urgent',5:'Non-urgent'};
var LIMIT={1:0,2:10,3:30,4:60,5:120};
var ROOMS=['—','ER 1','ER 2','ER 3','ER 4','ER 5','ER 6','Triage bay'];

function seed(){
  var n=Date.now();
  function p(i,name,age,c,esi,st,room,doc,ago,seen){return{id:'P-'+String(i).padStart(3,'0'),name:name,age:age,complaint:c,esi:esi,status:st,room:room,doctor:doc,arrived:n-ago*M,seenAt:seen==null?null:n-seen*M,closedAt:null}}
  var pts=[
    p(1,'Test Patient A',67,'Chest pain',2,'In treatment','ER 1','d1',48,40),
    p(2,'Test Patient B',8,'Fever and rash',3,'Waiting','—',null,35,null),
    p(3,'Test Patient C',34,'Deep hand laceration',3,'In treatment','ER 3','d2',72,55),
    p(4,'Test Patient D',81,'Fall, hip pain',2,'Awaiting results','ER 2','d3',95,80),
    p(5,'Test Patient E',25,'Sprained ankle',4,'Waiting','—',null,64,null),
    p(6,'Test Patient F',52,'Shortness of breath',1,'In treatment','ER 4','d1',20,18),
    p(7,'Test Patient G',41,'Migraine',4,'Discharged','—','d2',180,150),
    p(8,'Test Patient H',19,'Allergic reaction',3,'Discharged','—','d3',210,195)
  ];
  pts[6].closedAt=n-60*M;pts[7].closedAt=n-100*M;
  return{seq:9,
    doctors:[{id:'d1',name:'Dr. Amira Khan',note:'Emergency medicine'},{id:'d2',name:'Dr. Luis Ortega',note:'Emergency medicine'},{id:'d3',name:'Dr. Hana Sato',note:'Trauma'}],
    supervisors:[{id:'v1',name:'Sam Brooks',note:'Charge nurse'}],
    staff:[{id:'s1',name:'Priya (triage nurse)',note:'Triage'},{id:'s2',name:'Omar (registration)',note:'Front desk'}],
    patients:pts,
    log:[{t:n,who:'System',role:'system',a:'Prototype data loaded (fake patients)'}]};
}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load(),uid='v1',tab='board',showClosed=false;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function all(){return S.supervisors.map(function(x){return Object.assign({role:'supervisor'},x)})
  .concat(S.doctors.map(function(x){return Object.assign({role:'doctor'},x)}))
  .concat(S.staff.map(function(x){return Object.assign({role:'staff'},x)}))}
function me(){var a=all();return a.find(function(x){return x.id===uid})||a[0]}
function nameOf(id){var x=all().find(function(y){return y.id===id});return x?x.name:'Unassigned'}
function addLog(a){var u=me();S.log.push({t:Date.now(),who:u.name,role:u.role,a:a});save()}
function dur(ms){var m=Math.max(0,Math.round(ms/M));return m<60?m+' min':Math.floor(m/60)+'h '+(m%60)+'m'}
function findP(id){return S.patients.find(function(p){return p.id===id})}

function buildWho(){
  var g=function(label,arr){return '<optgroup label="'+label+'">'+arr.map(function(x){return '<option value="'+x.id+'"'+(x.id===uid?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</optgroup>'};
  document.getElementById('who').innerHTML=g('Supervisors',S.supervisors)+g('Doctors',S.doctors)+g('Staff',S.staff);
}

function render(){
  var u=me(),role=u.role;
  if((tab==='dir'||tab==='log')&&role!=='supervisor')tab='board';
  var pts=S.patients.filter(function(p){return role!=='doctor'||p.doctor===u.id});
  var open=pts.filter(function(p){return CLOSED.indexOf(p.status)<0});
  var closed=pts.filter(function(p){return CLOSED.indexOf(p.status)>=0});
  var waiting=open.filter(function(p){return p.status==='Waiting'});
  var seen=pts.filter(function(p){return p.seenAt});
  var avg=seen.length?Math.round(seen.reduce(function(a,p){return a+(p.seenAt-p.arrived)},0)/seen.length/M):null;
  var h='<div class="stats">'
   +'<div class="stat"><b>'+open.length+'</b><span>Active cases</span></div>'
   +'<div class="stat"><b>'+waiting.length+'</b><span>Waiting to be seen</span></div>'
   +'<div class="stat"><b>'+closed.length+'</b><span>Closed cases</span></div>'
   +'<div class="stat"><b>'+(avg==null?'—':avg+' min')+'</b><span>Average wait to be seen</span></div></div>';
  var t=[['board','Board']];
  if(role==='supervisor'){t.push(['dir','People'],['log','Audit log'])}
  h+='<div class="tabs">'+t.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(tab==='board')h+=boardHtml(role,u,open,closed);
  if(tab==='dir')h+=dirHtml();
  if(tab==='log')h+=logHtml();
  document.getElementById('app').innerHTML=h;
}

function boardHtml(role,u,open,closed){
  var h='';
  if(role==='doctor')h+='<p class="sub">Showing only your cases.</p>';
  if(role!=='doctor'){
    h+='<div class="panel"><h2>Add patient</h2><div class="form">'
     +'<input id="nm" placeholder="Name (fake)" aria-label="Name"><input id="ag" type="number" min="0" max="120" placeholder="Age" aria-label="Age">'
     +'<input id="cp" class="full" placeholder="Complaint" aria-label="Complaint">'
     +'<select id="es" class="full" aria-label="Priority">'+[1,2,3,4,5].map(function(i){return '<option value="'+i+'"'+(i===3?' selected':'')+'>Priority '+i+' – '+ESI[i]+'</option>'}).join('')+'</select>'
     +'<button class="full" data-do="add">Add to board</button></div></div>';
  }
  h+='<div class="legend">'+[1,2,3,4,5].map(function(i){return '<span><i class="dot e'+i+'" style="background:var(--c)"></i>'+i+' '+ESI[i]+'</span>'}).join('')+'</div>';
  var sort=function(a,b){return a.esi-b.esi||a.arrived-b.arrived};
  var list=open.slice().sort(sort);
  if(showClosed)list=list.concat(closed.slice().sort(function(a,b){return b.closedAt-a.closedAt}));
  h+='<div class="tabs"><button class="ghost" data-do="toggle">'+(showClosed?'Hide':'Show')+' closed cases</button>'+(role==='supervisor'?'<button class="ghost" data-do="reset">Reset fake data</button>':'')+'</div>';
  if(!list.length)return h+'<div class="empty">No active cases. New patients appear here when added.</div>';
  h+='<div class="grid">'+list.map(function(p){return card(p,role)}).join('')+'</div>';
  return h;
}

function card(p,role){
  var done=CLOSED.indexOf(p.status)>=0;
  var el=(done?p.closedAt:Date.now())-p.arrived;
  var late=!done&&p.status==='Waiting'&&el>LIMIT[p.esi]*M;
  var h='<div class="pt e'+p.esi+(done?' done':'')+'"><div class="top"><span class="badge">P'+p.esi+'</span><b>'+esc(p.name)+'</b><span class="sub">'+p.age+' yrs · '+esc(p.complaint)+'</span></div>'
   +'<div class="meta">'+esc(p.id)+' · '+esc(p.status)+' · '+esc(p.room)+' · '+esc(nameOf(p.doctor))+' · '+(done?'total ':'here ')+dur(el)+(late?' <span class="late">Overdue</span>':'')+'</div>';
  if(role==='supervisor'&&!done){
    h+='<div class="act"><select data-f="doc" data-id="'+p.id+'" aria-label="Doctor"><option value="">Unassigned</option>'+S.doctors.map(function(d){return '<option value="'+d.id+'"'+(p.doctor===d.id?' selected':'')+'>'+esc(d.name)+'</option>'}).join('')+'</select>'
     +'<select data-f="room" data-id="'+p.id+'" aria-label="Room">'+ROOMS.map(function(r){return '<option'+(p.room===r?' selected':'')+'>'+r+'</option>'}).join('')+'</select>'+statusSel(p)+'</div>';
  }else if(role==='doctor'&&!done){h+='<div class="act">'+statusSel(p)+'</div>'}
  return h+'</div>';
}
function statusSel(p){return '<select data-f="status" data-id="'+p.id+'" aria-label="Status">'+STATUSES.map(function(s){return '<option'+(p.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'}

function dirHtml(){
  var rows=all().map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+x.role+'</td><td>'+esc(x.note||'')+'</td></tr>'}).join('');
  return '<div class="panel"><h2>Add a person</h2><div class="form"><input id="pn" placeholder="Name" aria-label="Name"><select id="pr" aria-label="Role"><option value="doctor">Doctor</option><option value="supervisor">Supervisor</option><option value="staff">Staff</option></select><input id="pt" class="full" placeholder="Specialty or title" aria-label="Specialty or title"><button class="full" data-do="person">Add person</button></div></div>'
   +'<div class="panel tbl"><h2>Doctors, supervisors and staff</h2><table><tr><th>Name</th><th>Role</th><th>Specialty or title</th></tr>'+rows+'</table></div>';
}
function logHtml(){
  var rows=S.log.slice().reverse().map(function(l){return '<tr><td>'+new Date(l.t).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</td><td>'+esc(l.who)+'</td><td>'+esc(l.role)+'</td><td>'+esc(l.a)+'</td></tr>'}).join('');
  return '<div class="panel tbl"><h2>Audit log</h2><table><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th></tr>'+rows+'</table></div>';
}

document.getElementById('who').addEventListener('change',function(e){
  uid=e.target.value;tab='board';addLog('Signed in (simulated)');render();
});
var app=document.getElementById('app');
app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var u=me(),d=b.getAttribute('data-do'),tb=b.getAttribute('data-tab');
  if(tb){tab=tb;if(tb==='log')addLog('Opened audit log');render();return}
  if(d==='toggle'){showClosed=!showClosed;render();return}
  if(d==='add'&&u.role!=='doctor'){
    var nm=document.getElementById('nm').value.trim(),cp=document.getElementById('cp').value.trim(),ag=parseInt(document.getElementById('ag').value,10);
    if(!nm||!cp||isNaN(ag)||ag<0||ag>120){alert('Enter a name, an age from 0 to 120, and a complaint.');return}
    var es=parseInt(document.getElementById('es').value,10),id='P-'+String(S.seq++).padStart(3,'0');
    S.patients.push({id:id,name:nm,age:ag,complaint:cp,esi:es,status:'Waiting',room:'—',doctor:null,arrived:Date.now(),seenAt:null,closedAt:null});
    addLog('Added patient '+id+' (priority '+es+')');render();return}
  if(d==='person'&&u.role==='supervisor'){
    var n=document.getElementById('pn').value.trim(),r=document.getElementById('pr').value,nt=document.getElementById('pt').value.trim();
    if(!n){alert('Enter a name.');return}
    var key=r==='doctor'?'doctors':r==='supervisor'?'supervisors':'staff',pre=r[0]==='s'&&r!=='staff'?'v':r[0];
    S[key].push({id:pre+(Date.now()%100000),name:n,note:nt});
    addLog('Added '+r+': '+n);buildWho();render();return}
  if(d==='reset'&&u.role==='supervisor'){
    if(confirm('Replace all data with the fake starting data?')){var old=S.log;S=seed();S.log=old.concat([{t:Date.now(),who:u.name,role:u.role,a:'Reset to fake starting data'}]);save();buildWho();render()}
  }
});
app.addEventListener('change',function(e){
  var el=e.target,f=el.getAttribute('data-f');if(!f)return;
  var p=findP(el.getAttribute('data-id')),u=me();if(!p)return;
  if(u.role==='doctor'&&(p.doctor!==u.id||f!=='status'))return;
  if(u.role==='staff')return;
  if(f==='status'){
    var old=p.status;p.status=el.value;
    if(p.status!=='Waiting'&&!p.seenAt)p.seenAt=Date.now();
    if(CLOSED.indexOf(p.status)>=0){p.closedAt=Date.now();p.room='—'}else p.closedAt=null;
    addLog(p.id+' status: '+old+' → '+p.status);
  }else if(f==='doc'){p.doctor=el.value||null;addLog(p.id+' assigned to '+nameOf(p.doctor))}
  else if(f==='room'){p.room=el.value;addLog(p.id+' room: '+p.room)}
  render();
});
setInterval(function(){var t=document.activeElement&&document.activeElement.tagName;if(t!=='INPUT'&&t!=='SELECT')render()},30000);
buildWho();render();
</script>
</body>
</html>
