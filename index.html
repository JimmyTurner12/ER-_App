<style>
:root{--bg:#eef2f7;--fg:#14202e;--pn:#fff;--bd:#cfd8e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--fg:#e8eef5;--pn:#1a232d;--bd:#2c3a49}}
:root[data-theme="dark"]{--bg:#10161d;--fg:#e8eef5;--pn:#1a232d;--bd:#2c3a49}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:AppFont,Tahoma,sans-serif}
#bar{display:flex;gap:6px;padding:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:700 15px AppFont,Tahoma,sans-serif;padding:9px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--pn);color:var(--fg)}
button.p{background:#2a6aa5;color:#fff;border:0}
#vp{overflow:auto;max-height:calc(100dvh - 64px);touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#sz{margin:0 auto}
#sc{transform-origin:0 0;width:1485px;height:720px}
#cv{position:relative;width:1485px;height:720px;direction:rtl;background:linear-gradient(135deg,#dbe9f6,#f6fafe 55%,#e3eef9);color:#1b2b3d;font-family:AppFont,Tahoma,sans-serif;overflow:hidden}
#cv *{box-sizing:border-box}
.ab{position:absolute}
.pn{position:absolute;background:#fff;border:1.5px solid #cfdbe8;border-radius:22px;box-shadow:0 4px 14px #1b3f6a22}
.hb img{vertical-align:middle;margin:0 8px}.t img{vertical-align:middle;margin-left:4px}.hb{margin:12px;height:46px;border-radius:10px;background:linear-gradient(#3a7cb5,#245f94);color:#fff;font-weight:700;font-size:23px;line-height:46px;text-align:center}
.gr,.gi{position:absolute;inset:72px 12px 12px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:12px}
.cd{background:#fff;border:1.5px solid #cfd8e2;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 6px #1b3f6a18;min-height:0}
.ch{background:#e9eef3;display:flex;justify-content:space-around;align-items:center;direction:ltr;font-weight:700;font-size:22px;padding:5px 0;flex:none}
.cg{display:grid;grid-template-columns:1fr 1fr;direction:ltr;gap:6px 0;padding:6px 12px;justify-items:center;align-items:center;flex:none}
.ct{width:42px;height:42px;border-radius:50%;color:#fff;font-weight:700;font-size:21px;line-height:42px;text-align:center;font-style:normal;box-shadow:inset 0 -3px 5px #0003;overflow:hidden;white-space:nowrap}
.ct.sm{font-size:15px}
.wl{font-size:19px;direction:rtl}
.cdt{border-top:1.5px solid #dbe2ea;margin:2px 10px 0;padding:3px 0;font-weight:700;font-size:15px;line-height:1.3;flex:1;min-height:0;overflow:hidden;overflow-wrap:anywhere}
.pt{font-size:11.5px;line-height:1.2;margin-top:2px;font-weight:400}
.em{background:#e6edf4;border-style:dashed;padding:10px;font-size:15px;font-weight:700;gap:4px}
.t{background:#e9eef3;text-align:center;font-weight:700;font-size:16px;line-height:1.2;padding:5px 4px;flex:none;overflow-wrap:anywhere}
.v{white-space:nowrap;font-weight:700;text-align:center;padding:8px 6px 0;line-height:1.25;overflow-wrap:anywhere}
.s{font-size:13px;font-weight:400;text-align:center;padding:2px 6px 6px;line-height:1.25;overflow:hidden;overflow-wrap:anywhere}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;margin-left:8px;vertical-align:middle}
.pp{position:absolute;inset:72px 12px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pp .v{white-space:nowrap;padding-top:10px}.pp .s{display:none}
#ed{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:var(--pn);border-top:2px solid #2a6aa5;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));z-index:5;direction:rtl}
#ed[hidden],#ov[hidden]{display:none}
details{border:1px solid var(--bd);border-radius:10px;margin:6px 0;padding:6px 10px}
summary{font-weight:700;padding:6px 0}
label{display:block;margin:8px 0;font-size:14px}
input,select,textarea{width:100%;font:16px AppFont,Tahoma,sans-serif;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
input[type=checkbox]{width:22px;height:22px;vertical-align:middle}
.st{display:flex;gap:6px}.st button{padding:6px 16px}
#ov{position:fixed;inset:0;background:#000d;z-index:9;overflow:auto;text-align:center;color:#fff;padding:12px}
#ov img{max-width:100%;border-radius:8px;background:#fff}
#msg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:10px;z-index:30;font-weight:700;color:#fff;max-width:90vw;text-align:center}
#msg[hidden]{display:none}

const OPT={'ind.ras.st':['on','off'],'ind.amb.st':['on','off','busy']};
function merge(b,s){if(Array.isArray(b))return b.map((x,i)=>merge(x,Array.isArray(s)?s[i]:undefined));
if(b&&typeof b=='object'){const o={};for(const k in b)o[k]=merge(b[k],s&&typeof s=='object'?s[k]:undefined);return o}
if(typeof b=='string'&&typeof s=='number')return String(s);return typeof s==typeof b?s:b}
function fixup(d){const B=SAMPLE();for(const k in d.cats){d.cats[k].icon=B.cats[k].icon;d.cats[k].c.forEach((x,i)=>{if(!col[x.k])x.k=B.cats[k].c[i].k;x.v=String(x.v).replace(/\D/g,'').slice(0,6)})}
for(const p in OPT){const[a,b,c]=p.split('.');if(!OPT[p].includes(d[a][b][c]))d[a][b][c]=B[a][b][c]}
for(const x in col)if(typeof d.legend[x]!='string')d.legend[x]='';d.v=2;return d}
function load(){let raw;try{raw=localStorage.getItem(KEY)||localStorage.getItem('cc_v1')}catch(e){return{d:SAMPLE(),w:'التخزين المحلي غير متاح: لن تُحفظ التغييرات'}}
if(raw==null)return{d:SAMPLE()};
try{const s=JSON.parse(raw);if(!s||typeof s!='object'||!s.cats||!s.ind)throw 0;return{d:fixup(merge(SAMPLE(),s))}}
catch(e){try{localStorage.setItem('cc_corrupt_backup',raw)}catch(x){}return{d:SAMPLE(),w:'البيانات المحفوظة تالفة: عُرضت بيانات المثال وحُفظت نسخة احتياطية'}}}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const set=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
let mt;function toast(t,ok=1){const m=$('#msg');m.textContent=t;m.style.background=ok?'#2f8a5b':'#b01c2e';m.hidden=false;clearTimeout(mt);if(ok!=2)mt=setTimeout(()=>m.hidden=true,ok?2500:6000)}
const fT=()=>new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date());

const fs=(s,b,n)=>{const l=String(s).replace(/<[^>]*>/g,'').length;return l>n?Math.max(b*.55,b*n/l):b};

function applyZ(){$('#sc').style.transform=`scale(${Z})`;$('#sz').style.width=1485*Z+'px';$('#sz').style.height=720*Z+'px';$('#zl').textContent=Math.round(Z*100)+'%'}
function setZ(z,cx,cy){const v=$('#vp');cx??=v.clientWidth/2;cy??=v.clientHeight/2;z=Math.min(3,Math.max(.2,z));const r=z/Z,x=(v.scrollLeft+cx)*r-cx,y=(v.scrollTop+cy)*r-cy;Z=z;applyZ();v.scrollLeft=x;v.scrollTop=y}
const fitZ=()=>(innerWidth-8)/1485;
$('#zi').onclick=()=>setZ(Z*1.25);$('#zo').onclick=()=>setZ(Z/1.25);$('#z1').onclick=()=>{setZ(1);$('#vp').scrollLeft=0};$('#zf').onclick=()=>{setZ(fitZ());$('#vp').scrollLeft=0};
(()=>{const v=$('#vp');let d0,z0;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
v.addEventListener('touchstart',e=>{if(e.touches.length==2){d0=dist(e.touches);z0=Z}},{passive:true});
v.addEventListener('touchmove',e=>{if(e.touches.length==2&&d0){e.preventDefault();const r=v.getBoundingClientRect();setZ(z0*dist(e.touches)/d0,(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,(e.touches[0].clientY+e.touches[1].clientY)/2-r.top)}},{passive:false});
